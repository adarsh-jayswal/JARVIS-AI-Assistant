<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &mdash; JARVIS AI Assistant</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-glow-bg"></div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-wrapper">
                    <img src="{{ url_for('static', filename='images/jarvis_logo.jpg') }}" alt="JARVIS Logo" class="auth-logo-img">
                </div>
                <h1 class="auth-title">JARVIS</h1>
                <p class="auth-subtitle">Your Personal AI Assistant</p>
            </div>

            {% if error %}
            <div class="auth-error-banner">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="auth-input" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <div class="label-with-link">
                        <label for="password">Password</label>
                        <a href="javascript:void(0)" onclick="alert('Password reset functionality is disabled in local dev mode.')" class="forgot-link">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" name="password" class="auth-input" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn primary-btn auth-submit-btn">
                    <span>Login to JARVIS</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="{{ url_for('signup') }}" class="auth-switch-link">Create Account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
