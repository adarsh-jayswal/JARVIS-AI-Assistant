<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account &mdash; JARVIS AI Assistant</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-glow-bg"></div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-wrapper">
                    <img src="{{ url_for('static', filename='images/jarvis_logo.jpg') }}" alt="JARVIS Logo" class="auth-logo-img">
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join JARVIS Personal AI Assistant</p>
            </div>

            {% if error %}
            <div class="auth-error-banner" id="errorBanner">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>{{ error }}</span>
            </div>
            {% else %}
            <div class="auth-error-banner" id="errorBanner" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="errorBannerText"></span>
            </div>
            {% endif %}

            <form action="{{ url_for('signup') }}" method="POST" class="auth-form" id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="auth-input" placeholder="e.g. Tony Stark" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="auth-input" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="auth-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="auth-input" placeholder="Re-enter password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn primary-btn auth-submit-btn">
                    <span>Create Account</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-switch-link">Login</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorBanner = document.getElementById('errorBanner');
            const errorBannerText = document.getElementById('errorBannerText');

            if (password !== confirmPassword) {
                e.preventDefault();
                errorBannerText.textContent = "Passwords do not match.";
                errorBanner.style.display = "flex";
            } else if (password.length < 6) {
                e.preventDefault();
                errorBannerText.textContent = "Password must be at least 6 characters long.";
                errorBanner.style.display = "flex";
            }
        });
    </script>
</body>
</html>
